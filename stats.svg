<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214"><style>
.bg{fill:#ffffff;stroke:#d0d7de}
.h{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.big{font:600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.name{font:600 30px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:-.5px}
.lbl{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#656d76;letter-spacing:.4px}
.txt{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.mono{font:400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#656d76}
.rule{stroke:#eaeef2}
.acc{fill:#1a7f37}
.l0{fill:#ebedf0}.l1{fill:#9be9a8}.l2{fill:#40c463}.l3{fill:#30a14e}.l4{fill:#216e39}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117;stroke:#30363d}
.h,.big,.name,.txt{fill:#e6edf3}
.lbl,.mono{fill:#9198a1}
.rule{stroke:#21262d}
.acc{fill:#3fb950}
.l0{fill:#161b22}.l1{fill:#0e4429}.l2{fill:#006d32}.l3{fill:#26a641}.l4{fill:#39d353}
}
@media (prefers-reduced-motion:reduce){.fade,.grow{animation:none;opacity:1;transform:none}.blink{animation:none}}
</style><rect class="bg" x=".5" y=".5" width="411" height="213" rx="6"/><text x="24" y="36" class="lbl">LAST 12 MONTHS</text><line class="rule" x1="24" x2="388" y1="50" y2="50"/><g class="fade" style="animation-delay:0.00s"><text x="24.0" y="98" class="big">3 356</text><text x="24.0" y="118" class="lbl">CONTRIBUTIONS</text></g><g class="fade" style="animation-delay:0.08s"><text x="145.3" y="98" class="big">228</text><text x="145.3" y="118" class="lbl">ACTIVE DAYS</text></g><g class="fade" style="animation-delay:0.16s"><text x="266.7" y="98" class="big">303</text><text x="266.7" y="118" class="lbl">BUSIEST DAY</text></g><g class="fade" style="animation-delay:0.24s"><text x="24.0" y="166" class="big">25 d</text><text x="24.0" y="186" class="lbl">CURRENT STREAK</text></g><g class="fade" style="animation-delay:0.32s"><text x="145.3" y="166" class="big">25 d</text><text x="145.3" y="186" class="lbl">LONGEST STREAK</text></g><g class="fade" style="animation-delay:0.40s"><text x="266.7" y="166" class="big">65</text><text x="266.7" y="186" class="lbl">PER WEEK, AVG</text></g></svg>
